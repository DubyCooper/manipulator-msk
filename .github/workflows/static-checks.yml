name: Static site checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, chore/development-standards]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Check HTML resources, JSON-LD and JavaScript syntax
        run: python3 tests/check_static.py
